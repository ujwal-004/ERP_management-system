<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products | ERP</title><link rel="stylesheet" href="../../assets/css/style.css"></head>
<body data-page="products">
<header class="topbar"><div class="brand">ERP Management System</div><nav><a href="../../dashboard.html">Dashboard</a><a href="../users/user.html">Users</a><a href="../suppliers/supplier.html">Suppliers</a><a href="../inventory/inventory.html">Inventory</a><button id="logoutButton">Logout</button></nav></header>
<main class="container"><h1>Products</h1><p class="subtitle">Create, edit and remove products records.</p>
<section class="panel"><h2>Add / edit record</h2><form id="recordForm"><div class="form-grid"><div><label>Product name</label><input name="name" required></div><div><label>Category</label><input name="category"></div><div><label>Price</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>Reorder level</label><input name="reorder_level" type="number" min="0" value="0" required></div><div><label>Supplier ID (optional)</label><input name="supplier_id" type="number" min="1"></div><div><label>Description</label><textarea name="description"></textarea></div></div><div class="form-actions"><button id="saveButton" type="submit">Save record</button><button type="reset" class="secondary">Clear</button></div></form><p id="message" class="message"></p></section>
<section class="panel"><h2>Products list</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Reorder level</th><th>Supplier</th><th>Actions</th></tr></thead><tbody id="records"></tbody></table></div></section>
</main><script src="../../assets/js/app.js"></script></body></html>
