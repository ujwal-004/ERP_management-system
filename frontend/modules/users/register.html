<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create ERP User</title><link rel="stylesheet" href="../../assets/css/style.css"></head>
<body data-page="register">
<main class="auth-card card">
  <h1>Create user</h1><p class="subtitle">Create a standard demo account.</p>
  <form id="registerForm">
    <div class="form-field"><label for="username">Username</label><input id="username" name="username" required></div>
    <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="form-field"><label for="password">Password (8+ characters)</label><input id="password" name="password" type="password" minlength="8" required></div>
    <button type="submit">Create account</button>
  </form>
  <p id="message" class="message"></p><p class="small-note"><a href="login.html">Return to login</a></p>
</main><script src="../../assets/js/app.js"></script></body></html>
