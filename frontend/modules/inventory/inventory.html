<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventory | ERP</title><link rel="stylesheet" href="../../assets/css/style.css"></head>
<body data-page="inventory">
<header class="topbar"><div class="brand">ERP Management System</div><nav><a href="../../dashboard.html">Dashboard</a><a href="../users/user.html">Users</a><a href="../products/product.html">Products</a><a href="../suppliers/supplier.html">Suppliers</a><button id="logoutButton">Logout</button></nav></header>
<main class="container"><h1>Inventory</h1><p class="subtitle">Create, edit and remove inventory records.</p>
<section class="panel"><h2>Add / edit record</h2><form id="recordForm"><div class="form-grid"><div><label>Product ID</label><input name="product_id" type="number" min="1" required></div><div><label>Quantity</label><input name="quantity" type="number" min="0" required></div></div><div class="form-actions"><button id="saveButton" type="submit">Save record</button><button type="reset" class="secondary">Clear</button></div></form><p id="message" class="message"></p></section>
<section class="panel"><h2>Inventory list</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product ID</th><th>Product</th><th>Quantity</th><th>Reorder level</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="records"></tbody></table></div></section>
</main><script src="../../assets/js/app.js"></script></body></html>
