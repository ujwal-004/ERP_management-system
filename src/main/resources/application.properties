server.port=8080
spring.application.name=erp-management-system

# Persistent H2 is the zero-configuration default.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/erp_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
